[target.aarch64-unknown-linux-gnu]
image = "debian:trixie"
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential gcc-aarch64-linux-gnu blueprint-compiler gettext libadwaita-1-dev libadwaita-1-dev:arm64"
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
    "PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig",
    "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc",
]
